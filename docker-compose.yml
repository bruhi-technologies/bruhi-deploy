services:
  icecast:
    profiles: ["bundled-icecast"]
    image: libretime/icecast:2.5.0-alpine
    container_name: bruhi-icecast
    ports:
      - "${ICECAST_HOST_PORT:-8010}:8000"
    environment:
      ICECAST_SOURCE_PASSWORD: "${ICECAST_SOURCE_PASSWORD:?ICECAST_SOURCE_PASSWORD must be configured in production}"
      ICECAST_ADMIN_PASSWORD:  "${ICECAST_ADMIN_PASSWORD:?ICECAST_ADMIN_PASSWORD must be configured in production}"
      ICECAST_RELAY_PASSWORD:  "${ICECAST_RELAY_PASSWORD:?ICECAST_RELAY_PASSWORD must be configured in production}"
      ICECAST_HOSTNAME:        "${ICECAST_HOSTNAME:-localhost}"
      ICECAST_MAX_CLIENTS:     "${ICECAST_MAX_CLIENTS:-500}"
      ICECAST_MAX_SOURCES:     "${ICECAST_MAX_SOURCES:-20}"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bruhi-cloud:
    image: "${IMAGE:-ghcr.io/bruhi-technologies/bruhi-cloud:latest}"
    container_name: bruhi-cloud
    depends_on:
      icecast:
        condition: service_started
        required: false
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - bruhi_audio:/app/audio_files
      - bruhi_playlists:/tmp/liquidsoap-playlists
      - bruhi_db:/app/data
      - bruhi_audio_sockets:/tmp/bruhi-audio
    environment:
      PORT:                  "${PORT:-8000}"
      LOG_LEVEL:             "${LOG_LEVEL:-warning}"
      BRUHI_ENV:             "production"
      SESSION_COOKIE_SECURE: "true"
      CORS_ORIGINS:          "${CORS_ORIGINS:-}"
      ICECAST_SOURCE_PASSWORD: "${ICECAST_SOURCE_PASSWORD:-${ICECAST_PASSWORD:-}}"
      ICECAST_PASSWORD:        "${ICECAST_PASSWORD:-${ICECAST_SOURCE_PASSWORD:-}}"
      BRUHI_AUDIO_API_TOKEN:   "${BRUHI_AUDIO_API_TOKEN:-}"
      # Set to "bundled" when using bundled Icecast so Station 1 is auto-created on license activation.
      BRUHI_ICECAST_MODE:    "${BRUHI_ICECAST_MODE:-bundled}"
      # Public URL of this instance (used for passkeys, invite links, etc.)
      BRUHI_URL:             "${BRUHI_URL}"
      # WebAuthn / Passkeys — must match the domain users access the app on
      BRUHI_RP_ID:           "${BRUHI_RP_ID}"
      BRUHI_RP_NAME:         "${BRUHI_RP_NAME:-brūhi Cloud}"
      # Storage paths
      BRUHI_DB:              "/app/data/bruhi.db"
      AUDIO_DIR:             "/app/audio_files"
      # bruhi-audio Rust playout daemon (runs inside the same container)
      BRUHI_AUDIO_API:       "http://localhost:7700"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── Caddy Reverse Proxy (HTTPS / Auto-SSL) ────────────────────────────────
  # Activated when COMPOSE_PROFILES contains "proxy".
  # Caddy auto-provisions and renews Let's Encrypt certificates.
  # Required .env settings:
  #   DOMAIN=radio.yourdomain.com
  #   COMPOSE_PROFILES=bundled-icecast,proxy   (or proxy alone for external Icecast)
  caddy:
    profiles: ["proxy"]
    image: caddy:2.8-alpine
    container_name: bruhi-caddy
    depends_on:
      - bruhi-cloud
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bruhi_audio:
  bruhi_playlists:
  bruhi_db:
  bruhi_audio_sockets:
  caddy_data:     # Caddy certificate storage
  caddy_config:   # Caddy internal config cache
