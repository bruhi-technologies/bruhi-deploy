services:
  icecast:
    profiles: ["bundled-icecast"]
    image: infiniteproject/icecast:latest
    container_name: bruhi-icecast
    ports:
      - "${ICECAST_HOST_PORT:-8010}:8000"
    environment:
      ICECAST_SOURCE_PASSWORD: "${ICECAST_PASSWORD}"
      ICECAST_ADMIN_PASSWORD:  "${ICECAST_ADMIN_PASSWORD}"
      ICECAST_RELAY_PASSWORD:  "${ICECAST_RELAY_PASSWORD}"
      ICECAST_HOSTNAME:        "${ICECAST_HOSTNAME:-localhost}"
      ICECAST_MAX_CLIENTS:     "${ICECAST_MAX_CLIENTS:-500}"
      ICECAST_MAX_SOURCES:     "${ICECAST_MAX_SOURCES:-20}"
    restart: always

  bruhi-cloud:
    image: "${IMAGE:-ghcr.io/bruhi-technologies/bruhi-cloud:latest}"
    container_name: bruhi-cloud
    depends_on:
      icecast:
        condition: service_started
        required: false
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - bruhi_audio:/app/audio_files
      - bruhi_playlists:/tmp/liquidsoap-playlists
      - bruhi_db:/app/data
      - bruhi_audio_sockets:/tmp/bruhi-audio
    environment:
      PORT:                  "${PORT:-8000}"
      LOG_LEVEL:             "${LOG_LEVEL:-warning}"
      BRUHI_ENV:             "production"
      SESSION_COOKIE_SECURE: "true"
      CORS_ORIGINS:          "${CORS_ORIGINS:-}"
      BRUHI_URL:             "${BRUHI_URL}"
      BRUHI_RP_ID:           "${BRUHI_RP_ID}"
      BRUHI_RP_NAME:         "${BRUHI_RP_NAME:-brūhi Cloud}"
      BRUHI_DB:              "/app/data/bruhi.db"
      AUDIO_DIR:             "/app/audio_files"
      BRUHI_AUDIO_API:       "http://localhost:7700"
      ICECAST_HOST:          "${ICECAST_HOST:-icecast}"
      ICECAST_PORT:          "${ICECAST_PORT:-8000}"
      ICECAST_PASSWORD:      "${ICECAST_PASSWORD}"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    profiles: ["proxy"]
    image: caddy:2-alpine
    container_name: bruhi-caddy
    depends_on:
      - bruhi-cloud
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: "${DOMAIN}"
    restart: always

volumes:
  bruhi_audio:
  bruhi_playlists:
  bruhi_db:
  bruhi_audio_sockets:
  caddy_data:
  caddy_config:
